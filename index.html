<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RICH TREDING</title>

<style>
body{
margin:0;
background:#000;
overflow:hidden;
font-family:Segoe UI;
}

/* RGB BORDER */
@property --angle{
syntax:"<angle>";
initial-value:0deg;
inherits:false;
}

.hud{
position:fixed;
width:190px;
backdrop-filter:blur(18px);
background:rgba(20,20,40,.35);
border-radius:28px;
padding:14px;
color:#fff;
text-align:center;
z-index:9999;
touch-action:none;
cursor:grab;
border:3px solid;
border-image:linear-gradient(var(--angle),
#00fff0,#ff00f0,#00ff95,#00fff0)1;
animation:borderRotate 5s linear infinite;
box-shadow:0 0 45px #00fff5aa;
transition:.3s;
}

@keyframes borderRotate{
to{--angle:360deg;}
}

#loginHUD{top:20px;left:20px;}
#modHUD{top:20px;right:20px;display:none;}

.title{
font-size:16px;
font-weight:bold;
background:linear-gradient(90deg,#00fff0,#ff00f0);
-webkit-background-clip:text;
color:transparent;
}

input{
width:100%;
padding:7px;
border-radius:12px;
border:1px solid #00fff5;
background:#000;
color:#fff;
text-align:center;
margin-top:6px;
}

button{
width:100%;
padding:7px;
margin-top:6px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#00fff0,#00ff95);
font-weight:bold;
}

.count{font-size:22px;color:#ffea00;}
.signal{
font-size:30px;
font-weight:bold;
animation:pulse 1s infinite alternate;
}

@keyframes pulse{
from{transform:scale(1);}
to{transform:scale(1.3);}
}

.period{font-size:11px;color:#aaa;}
.clock{font-size:12px;}

.history{
font-size:10px;
height:45px;
overflow:hidden;
margin-top:5px;
}

.mini{
width:115px !important;
padding:8px !important;
}

iframe{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
border:none;
z-index:1;
}
</style>
</head>

<body>

<iframe src="https://deshclub2.com/#/register?invitationCode=15173100315"><https://tkclub2.com/#/home/AllLotteryGames/WinGo?id=1></iframe>

<div id="loginHUD" class="hud">
<div class="title">RICH TRADING</div>
<input id="pwd" type="password" placeholder="Password">
<button id="loginBtn">LOGIN</button>
</div>

<div id="modHUD" class="hud">
<div class="title">RICH TRADING</div>
<div class="clock" id="clock">00:00:00</div>
<div class="count" id="count">30</div>
<div id="loader">⚡ AI...</div>
<div class="signal" id="signal" style="display:none">BIG</div>
<div class="period" id="period">ID:000000</div>
<div class="history" id="history"></div>


</div>

<audio id="beep">
<source src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg">
</audio>

<script>

/* =========================
   PASSWORD SYSTEM
========================= */

let currentPass = localStorage.getItem("hudPass") || "vip99";

document.getElementById("loginBtn").addEventListener("click",function(){

let inputPass =
document.getElementById("pwd").value.trim();

if(inputPass === currentPass){

navigator.vibrate?.(120);

document.getElementById("loginHUD")
.style.display="none";

document.getElementById("modHUD")
.style.display="block";

}else{

navigator.vibrate?.([100,50,100]);
alert("Wrong Password!");

}

});

/* Change Password */
function changePass(){

let newPass = prompt("Enter New Password:");

if(newPass && newPass.trim().length>0){

currentPass = newPass.trim();
localStorage.setItem("hudPass",currentPass);
alert("Password Updated!");

}

}

/* =========================
   UI CONTROLS
========================= */

function toggleTheme(){
document.body.style.background =
document.body.style.background === "rgb(5, 5, 32)"
? "#000"
: "#050520";
}

function toggleMini(){
document.getElementById("modHUD")
.classList.toggle("mini");
}

function goFull(){
if(!document.fullscreenElement){
document.documentElement.requestFullscreen();
}else{
document.exitFullscreen();
}
}

/* =========================
   CLOCK
========================= */

setInterval(()=>{
document.getElementById("clock")
.innerText=new Date()
.toLocaleTimeString("en-GB");
},1000);

/* =========================
   AI SYSTEM
========================= */

let last=-1;
let hist=[];

setInterval(()=>{

let d=new Date();
let total=d.getMinutes()*60+d.getSeconds();
let remain=30-(total%30);

document.getElementById("count")
.innerText=remain;

let period=Math.floor(total/30);

if(period!==last){

document.getElementById("loader")
.style.display="block";

document.getElementById("signal")
.style.display="none";

setTimeout(()=>{

let sig=["BIG","SMALL","WAIT"];
let s=sig[Math.floor(Math.random()*3)];

document.getElementById("signal")
.innerText=s;

document.getElementById("signal")
.style.display="block";

document.getElementById("loader")
.style.display="none";

document.getElementById("period")
.innerText="ID:"+
Date.now().toString().slice(-6);

hist.unshift(s);
hist=hist.slice(0,5);

document.getElementById("history")
.innerText=hist.join(" | ");

document.getElementById("beep").play();
navigator.vibrate?.(70);

},1200);

last=period;
}

},300);

/* =========================
   DRAG SYSTEM (STABLE)
========================= */

function drag(el){

let x=0,y=0,drag=false;

el.addEventListener("pointerdown",e=>{
drag=true;
x=e.clientX-el.offsetLeft;
y=e.clientY-el.offsetTop;
});

document.addEventListener("pointermove",e=>{
if(!drag)return;
el.style.left=e.clientX-x+"px";
el.style.top=e.clientY-y+"px";
});

document.addEventListener("pointerup",()=>{
drag=false;
});

}

drag(document.getElementById("loginHUD"));
drag(document.getElementById("modHUD"));

</script>

</body>
</html>
